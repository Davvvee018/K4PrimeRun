  function beep(freq, dur, type, vol, slide) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var t = actx.currentTime;
      var o = actx.createOscillator(), gn = actx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      gn.gain.setValueAtTime(vol || 0.05, t);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(gn); gn.connect(actx.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }

  // Плавное смешивание состояний анимации, не привязанное к частоте экрана.
  function actorLerp(from, to, speed, dt) {
    return from + (to - from) * (1 - Math.exp(-speed * dt));
  }
  function updateActor(dt) {
    var p=g.actor;
    if(!p) p=g.actor=newActorState();
    p.clock += dt;
    var moving = state === "play" && (g.mode === "run" || g.mode === "parkour") ? 1 : 0.13;
    var running = g.onGround && g.dashT <= 0 ? moving : 0;
    p.run=actorLerp(p.run, running, running?12:17, dt);
    p.air=actorLerp(p.air, g.onGround?0:1, g.onGround?16:21, dt);
    p.falling=actorLerp(p.falling, !g.onGround && g.vy>40 ? 1 : 0, 13, dt);
    p.dash=actorLerp(p.dash, g.dashT>0?1:0, g.dashT>0?24:13, dt);
    p.hurt=Math.max(0,p.hurt-dt*5.2);
    p.fire=Math.max(0,p.fire-dt*8.5);
    p.takeoff=Math.max(0,p.takeoff-dt*9.5);
    p.landing=Math.max(0,p.landing-dt*5.3);
    p.brake=actorLerp(p.brake, g.dashT<=0 && p.dash>.16 ? .28 : 0, 15, dt);
    var a=Math.atan2(g.aim.y-(g.py-52),g.aim.x-playerX()-6);
    a=Math.max(-1.5,Math.min(1.2,a));
    p.aim=actorLerp(p.aim,a,15,dt);
    p.glance=actorLerp(p.glance,Math.max(-1,Math.min(1,(g.aim.y-(g.py-70))/165)),3.7,dt);
  }

    var p = toGame(e);
    shoot(p.x, p.y);
  });
  $("#jump").addEventListener("pointerdown", function (e) {
    e.preventDefault(); e.stopPropagation(); jump();
  });
  $("#dash").addEventListener("pointerdown", function(e) {
    e.preventDefault(); e.stopPropagation(); dash();
  });
  panel.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var a = el.getAttribute("data-act");
    if (a === "install") { if(window.K4Install) window.K4Install.request(); }
    else if (a === "start") startGame(1);
    else if(a==="retry") startGame(g.level);
    else if(a==="buy") buyUpgrade(el.getAttribute("data-upgrade"));
    else if(a==="map" || a==="shop") {state="menu";stage.classList.remove("playing");showPanel(a);}
    else if (a === "level") startGame(+el.getAttribute("data-level"));
    else if (a === "resume") resumeGame();
    else if (a === "menu") { state = "menu"; stage.classList.remove("playing"); showPanel("menu"); }
  });
  $("#pause").addEventListener("click", pauseGame);
  $("#snd").addEventListener("click", toggleSound);
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("button");
    if (b) b.blur();
  });
  window.addEventListener("keydown", function (e) {
    var c = e.code;
    if (c === "Space" || c === "ArrowUp" || c === "KeyW") {
      e.preventDefault();
      if (state === "play" && !e.repeat) jump();
      return;
    }
    if (c === "Enter") {
      if (state === "menu" || state === "over") startGame();
      else if (state === "paused") resumeGame();
    } else if (c === "KeyP" || c === "Escape") togglePause();
    else if (c === "KeyM") toggleSound();
    else if ((c === "ShiftLeft" || c === "ShiftRight") && !e.repeat) { e.preventDefault(); dash(); }
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) pauseGame();
  });

  function jump() {
    if (state !== "play") return;
    g.jumpBuf = 0.12;
  }

  // Энергорывок: короткий настоящий рывок вперёд с возвратом камеры.
  // На раннере и паркуре камера догоняет героя: объекты остаются позади.
  // В обороне герой делает выпад к противнику, не сдвигая всю арену.
  function playerX() { return PX + g.dashX; }

  function dash() {
    if (state !== "play" || g.clearT > 0 || g.dashCd > 0 || g.dashT > 0 || g.mode === "range") return;
    g.dashDuration = 0.43;
    g.dashElapsed = 0;
    g.dashX = 0;
    g.dashPrevX = 0;
    g.dashWorld = 0;
    g.dashStep = 0;
    g.dashT = g.dashDuration;
    if(g.actor) {g.actor.brake=0;g.actor.dash=.22;}
    g.dashCd = Math.max(2.6, (g.mode === "defense" ? 5.8 : 8.5) - lvUpgrade("dash") * 1.35);
    g.inv = Math.max(g.inv, 0.59);
    g.shake = Math.max(g.shake, 0.075);
    sparks(PX - 14, g.py - 47, "#FF913B", 20);
    floatText(PX + 45, g.py - 104, "ЭНЕРГОРЫВОК!", "#FFC07B");
    beep(380, 0.16, "sawtooth", 0.045, 650);
  }

  function updateDash(dt) {
    g.dashPrevX = g.dashX;
    g.dashStep = 0;
    if (g.dashT <= 0) { g.dashX = 0; return; }
    g.dashElapsed = Math.min(g.dashDuration, g.dashElapsed + dt);
    var phase = g.dashElapsed / g.dashDuration;
    // Первую половину герой бросается вперёд на 105 px; вторую камера плавно догоняет его.
    var outbound = phase < 0.53 ? Math.sin(phase / 0.53 * Math.PI / 2) :
      Math.pow(Math.max(0, (1 - phase) / 0.47), 2);
    g.dashX = (105 + lvUpgrade("dash") * 12) * outbound;
    if (g.mode === "run" || g.mode === "parkour") {
      var s = Math.min(1, phase / 0.86);
      var cameraFollow = (134 + lvUpgrade("dash") * 15) * (1 - Math.pow(1 - s, 2));
      g.dashStep = Math.max(0, cameraFollow - g.dashWorld);
      g.dashWorld = cameraFollow;
    }
    g.dashT = Math.max(0, g.dashDuration - g.dashElapsed);
    if (g.dashT <= 0) g.dashX = 0;
  }

  function dashStrike(t) {
    if (g.dashT <= 0 || g.dashX <= g.dashPrevX + 0.001 ||
        t.hp !== 1 || (t.kind !== "rusher" && t.kind !== "scout" && t.kind !== "weaver")) return false;
    var from = PX + g.dashPrevX - 13, to = PX + g.dashX + 27;
    if (t.x + t.r < from || t.x - t.r > to ||
        Math.abs(t.y - (g.py - 51)) > t.r + 33) return false;
    var index = g.targets.indexOf(t);
    if (index < 0) return false;
    g.targets.splice(index, 1);
    g.levelHits++; g.combo++; g.maxCombo = Math.max(g.maxCombo, g.combo);
    g.score += 170;
    sparks(t.x, t.y, "#FF9A45", 15);

    if (g.mode === "defense") checkDefenseWave();
    beep(210, 0.11, "sawtooth", 0.045, 370);
    return true;
  }

  function dashSmashObstacle(o) {
    if (g.dashT <= 0 || g.dashX <= g.dashPrevX + 0.001 ||
        (o.kind !== "crate" && o.kind !== "spikes")) return false;
    var from = PX + g.dashPrevX - 13, to = PX + g.dashX + 30;
    if (o.x > to || o.x + o.w < from || g.py < GROUND - o.h - 18) return false;
    var index = g.obstacles.indexOf(o);
    if (index < 0) return false;
    g.obstacles.splice(index, 1);
    g.obstaclePassed++; g.score += 95;
    sparks(o.x + o.w / 2, GROUND - o.h / 2, "#FF9A45", 19);

    beep(150, 0.13, "square", 0.04, 260);
    return true;
  }

  /* ---------- Стрельба и усиления ---------- */
  function gunTip() {
    var sx = playerX() + 6, sy = g.py - 52;
    var a = Math.atan2(g.aim.y - sy, g.aim.x - sx);
    a = Math.max(-1.5, Math.min(1.2, a));
    return { x: sx + Math.cos(a) * (32 - g.recoil * 20), y: sy + Math.sin(a) * (32 - g.recoil * 20), a: a, sx: sx, sy: sy };
  }

  function sparks(x, y, color, n, spread, kind) {
    n = Math.min(n, Math.max(0, 220 - g.parts.length));
    spread = spread || 1;
    kind = kind || "spark";
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, s = rand(80, 380) * spread;
      g.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - rand(20,80), life: rand(0.26, 0.72), max: 0.72, color: color,
        size: rand(2.2, kind==="smoke"?8.5:5.4), shape: Math.random()<0.55?"square":"circle", kind:kind, rot:rand(0,6.28), vr:rand(-9,9) });
    }
  }
  function explosionBurst(x,y,base){
    sparks(x,y,base||"#FFAD68",18,1.25,"spark");
    sparks(x,y,"#FFF4D6",10,0.92,"spark");
    sparks(x,y,"rgba(255,160,90,.65)",8,0.55,"smoke");
  }
  function floatText(x, y, s, color) {
    g.texts.push({ x: x, y: y, s: s, color: color, life: 0.8 });
  }

  function applyPower(p) {
    var meta = POWER_DATA[p.kind];
    if (p.kind === "life") {
      if (g.lives < g.maxLives) { g.lives++; floatText(p.x, p.y, "+1 ЖИЗНЬ", meta.color); }
      else { g.score += 400; floatText(p.x, p.y, "+400", meta.color); }
    } else {
      g.powers[p.kind] = Math.min(meta.duration * 2, Math.max(0, g.powers[p.kind]) + meta.duration);
      floatText(p.x, p.y, meta.name, meta.color);
    }
    sparks(p.x, p.y, meta.color, 20);
    beep(600, 0.12, "sine", 0.06, 650);
    g.pickups.splice(g.pickups.indexOf(p), 1);
  }

  function spawnPower() {
    if (g.pickups.length >= 2) return;
    var roll = Math.random();
    var kind = roll < 0.24 ? "life" : roll < 0.50 ? "double" : roll < 0.75 ? "slow" : "shield";
    if (g.lives <= 2 && Math.random() < 0.55) kind = "life";
    g.pickups.push({ x: rand(590, 865), y: rand(120, 330), age: 0, kind: kind, r: 26 });
  }

  // Shootable arena devices. They are large and clearly labelled for one-finger interaction.
  function spawnInteractive(){
    if(g.interactives.length>=2)return;
    var choices = g.mode==="parkour" ? ["capacitor","terminal","barrel"] :
                  g.mode==="range" ? ["capacitor","barrel"] :
                  g.mode==="defense" ? ["barrel","capacitor"] : ["barrel","terminal","capacitor"];
    var kind=choices[Math.floor(Math.random()*choices.length)];
    g.interactives.push({kind:kind,x:g.mode==="defense"?rand(650,875):rand(705,880),
      y:g.mode==="parkour"?330:rand(205,320),r:28,age:0,life:g.mode==="range"?8:13});
  }
  function activateInteractive(o){
    var color=o.kind==="barrel"?"#FFAC6C":o.kind==="terminal"?"#82F3DF":"#A6B4FF";
    explosionBurst(o.x,o.y,color); sparks(o.x,o.y,color,12,1.0,"spark");
    if(o.kind==="barrel"){
      // Взрыв в радиусе 175 уничтожает дронов и препятствия.
      for(var i=g.targets.length-1;i>=0;i--){
        var t=g.targets[i];if(Math.hypot(t.x-o.x,t.y-o.y)<180){
          g.targets.splice(i,1);g.levelHits++;g.hits++;g.score+=120;coins(4);g.earned+=4;
        }
      }
      for(var j=g.obstacles.length-1;j>=0;j--){
        var obstacle=g.obstacles[j];
        if(Math.abs(obstacle.x+obstacle.w/2-o.x)<160 && obstacle.kind!=="gap")g.obstacles.splice(j,1);
      }
      if(g.mode==="defense")checkDefenseWave();
      g.shake=Math.max(g.shake,.11);floatText(o.x,o.y-38,"ВЗРЫВ + ОЧКИ",color);
    } else if(o.kind==="terminal"){
      g.lasersOff=8;g.score+=140;floatText(o.x,o.y-42,"ЛОВУШКИ ОТКЛЮЧЕНЫ",color);
    } else {
      g.powers.slow=Math.max(g.powers.slow,5);g.score+=100;
      floatText(o.x,o.y-42,"SLOW 5 СЕК",color);
    }
    var ix=g.interactives.indexOf(o);if(ix!==-1)g.interactives.splice(ix,1);
    beep(740,.12,"square",.05,260);
  }

  function fireOne(x, y, tip) {
    g.shots++;
    g.beams.push({ x1: tip.x, y1: tip.y, x2: x, y2: y, life: 0.12 });
    for(var ii=g.interactives.length-1;ii>=0;ii--){
      var io=g.interactives[ii];if(Math.hypot(io.x-x,io.y-y)<io.r+(coarseInput?20:12)){
        activateInteractive(io);return true;
      }
    }
    var i, d, target = null, bestD = 1e9;
    // В первую очередь можно сбить летящий снаряд босса.
    for (i = 0; i < g.projectiles.length; i++) {
      var pr = g.projectiles[i]; d = Math.hypot(pr.x - x, pr.y - y);
      if (d < pr.r + 12 && d < bestD) { target = { type: "projectile", item: pr }; bestD = d; }
    }
    for (i = 0; i < g.targets.length; i++) {
      var t = g.targets[i]; d = Math.hypot(t.x - x, t.y - y);
      if (d <= t.r + (coarseInput ? 19 : 11) && d < bestD) { target = { type: "target", item: t }; bestD = d; }
    }
    if (target) {
      var hit = target.item;
      // Дрон поддержки накрывает союзников щитом: сначала сбиваем генератор.
      if (target.type === "target" && g.mode === "defense" && hit.kind !== "guardian") {
        var guard = g.targets.find(function(e) {
          return e.kind === "guardian" && e.shieldCharge > 0 && Math.hypot(e.x-hit.x,e.y-hit.y) < 150;
        });
        if (guard) {
          guard.shieldCharge--; guard.flash = 0.2;
          sparks(hit.x,hit.y,"#B89EFF",9);

          beep(290,.1,"triangle",.038,120);
          return true;
        }
      }
      g.combo++; g.maxCombo = Math.max(g.maxCombo, g.combo); g.hits++;
      if (target.type === "target") {
        hit.hp -= (hit.maxHp>1 && Math.random() < lvUpgrade("gun")*.22) ? 2 : 1;
        if (hit.hp > 0) {
          g.score += 35;
          hit.flash = 0.17;

          sparks(hit.x, hit.y, "#FFBF67", 10);
          beep(540, 0.09, "triangle", 0.04, -120);
          return true;
        }
        g.targets.splice(g.targets.indexOf(hit), 1);
        if(hit.kind === "gold" && g.mode === "range") {
          g.timer = Math.min(60,g.timer+4);
          g.score+=550;

          sparks(hit.x,hit.y,"#FFD778",17);
          return true;
        }
        g.levelHits++;
        // Награда за точность, начисляется и сохраняется немедленно.
        var killCredits = hit.kind === "guardian" ? 7 : hit.kind === "armor" ? 5 : 3;
        coins(killCredits);g.earned+=killCredits;
        if (g.mode === "defense") checkDefenseWave();
        var pts = 100 + Math.min(g.combo, 20) * 15 + Math.round((1 - hit.age / hit.life) * 60);
        g.score += pts;
      } else {
        g.projectiles.splice(g.projectiles.indexOf(hit), 1);
        g.score += 120;
      }
      sparks(hit.x, hit.y, GLOW, 14); sparks(hit.x, hit.y, WHITE, 8);
      beep(1250, 0.08, "square", 0.04, 270);
      return true;
    }
    var b = g.boss;
    if (b) {
      // Узлы движутся вместе с боссом. Допуск больше для пальца на телефоне.
      for(var ni=b.nodes.length-1;ni>=0;ni--) {
        var pos=bossNodePosition(b,ni),node=b.nodes[ni];
        if(Math.hypot(pos.x-x,pos.y-y)<(coarseInput?35:26)) {
          node.hp--;node.flash=.22;
          sparks(pos.x,pos.y,"#8CCFFF",14);
          g.hits++;g.score+=75;
          beep(860,.10,"square",.045,250);
          if(node.hp<=0) {
            b.nodes.splice(ni,1);
            if(b.nodes.length===0) {
              b.openT=g.mode==="boss"?5.2:6.2;
              b.attackGap=Math.max(b.attackGap,.6);

              g.banner=.9;g.bannerTitle="ЩИТ СБИТ";g.bannerSub="Стреляй в светящееся ядро!";
            }
          }
          return true;
        }
      }
      if(Math.hypot(b.x-x,b.y-y)<=b.r*.58+(coarseInput?16:8)) {
        if(b.nodes.length>0) {

          beep(240,.09,"triangle",.03);
          return true;
        }
        if(b.hitCd>0) return true;
        b.hitCd=g.mode==="boss"?.27:.22;
        b.hp--;b.flash=.16;g.combo++;g.maxCombo=Math.max(g.maxCombo,g.combo);
        g.hits++;g.score+=175;
        sparks(x,y,"#FFC47F",10);
        beep(680,.09,"square",.05,180);
        if(b.hp<=0){finishLevel();return true;}
        var nextPhase=b.hp<=b.max/3?3:b.hp<=b.max*2/3?2:1;
        if(nextPhase>b.phase) {
          b.phase=nextPhase;b.phaseGlow=1.1;
          resetBossShield(b);b.attackGap=2.0;
          g.banner=1.65;g.bannerTitle="ФАЗА " + b.phase;
          g.bannerSub="Босс усилился — сбей новые модули!";
          sparks(b.x,b.y,WARN,22);
        }
        return true;
      }
    }
    return false;
  }

  function shoot(x, y) {
    if (state !== "play" || g.clearT > 0) return;
    g.aim.x = x; g.aim.y = y;
    for (var p = g.pickups.length - 1; p >= 0; p--) {
      var pick = g.pickups[p];
      if (Math.hypot(pick.x - x, pick.y - y) <= pick.r + 13) {
        applyPower(pick); return;
      }
    }
    var tip = gunTip();
    g.recoil = 0.22; g.muzzle = 0.1;
    if(g.actor) g.actor.fire = 1;
    sparks(tip.x, tip.y, g.powers.double > 0 ? POWER_DATA.double.color : GLOW, 4);
    var mult = g.powers.double > 0 ? 2 : 1;
    var success = fireOne(x, y, tip);
    if (mult === 2 && state === "play" && g.clearT <= 0) {
      // Второй выстрел сам наводится на ближайшую соседнюю цель, либо летит параллельно.
      var alt = null, near = 115;
      g.targets.concat(g.projectiles).forEach(function(t) {
        var d = Math.hypot(t.x-x,t.y-y);
        if (d < near) { near = d; alt = t; }
      });
      var ax = alt ? alt.x : x + 35, ay = alt ? alt.y : y - 30;
      success = fireOne(ax, ay, tip) || success;
    }
    beep(success ? 900 : 190, 0.07, success ? "sawtooth" : "triangle", 0.035, success ? -500 : -70);
    if (!success) { g.combo = 0; sparks(x, y, "#6B7088", 4); }
  }

  function finishLevel() {
    if (g.clearT > 0) return;
    var b = g.boss, x = b ? b.x : (g.mode === "parkour" ? PX + 40 : 700);
    var y = b ? b.y : (g.mode === "parkour" ? g.py - 70 : 220);
    var bonus = 500 * g.level + Math.max(0, g.lives - 1) * 100;
    g.score += bonus;
    // Три звезды зависят от количества оставшихся жизней, награда за каждую новую звезду одноразовая.
    var stars = g.lives >= Math.max(1,g.levelStartLives-1) ? 3 : g.lives >= Math.max(1,g.levelStartLives-3) ? 2 : 1;
    var missionIndex = g.level-1;
    var oldStars = progress.stars[missionIndex];
    if(stars > oldStars){ progress.stars[missionIndex]=stars; saveProgress(); }
    var reward = 65 + stars*25 + Math.max(0,stars-oldStars)*70;
    coins(reward);g.earned+=reward;
    sparks(x, y, ACCENT, 38); sparks(x, y, GLOW, 26); sparks(x, y, WHITE, 18);
    floatText(x, y - 80, "+" + fmt(bonus), GLOW);
    g.boss = null; g.targets = []; g.obstacles = []; g.projectiles = []; g.pickups = [];
    g.clearT = 2.5; g.banner = 2.5;
    g.bannerTitle = "УРОВЕНЬ " + g.level + " ПРОЙДЕН";
    g.bannerSub = "★".repeat(stars) + " · +" + reward + " ✦ · далее: " + modeOf(g.level + 1).title;
    if (g.level + 1 > unlocked) {
      unlocked = g.level + 1;
      try { localStorage.setItem("prime_run_unlocked_v6", String(unlocked)); } catch (e) {}
    }
    beep(784, 0.15, "sine", 0.065, 260);
  }

  function hurt(x, y) {
    if (g.inv > 0) return;
    if (g.powers.shield > 0) {
      g.inv = 0.5; sparks(x == null ? PX : x, y == null ? g.py - 40 : y, POWER_DATA.shield.color, 12);
      floatText(PX, g.py - 95, "ЩИТ!", POWER_DATA.shield.color);
      beep(460, 0.1, "sine", 0.04, -100);
      return;
    }
    g.lives--; g.combo = 0; g.inv = 1.2; g.shake = 0.28; g.hitFlash=.35;
    if(g.actor) g.actor.hurt=1;
    sparks(x == null ? PX : x, y == null ? g.py - 36 : y, WARN, 18);
    beep(130, 0.28, "sawtooth", 0.07, -60);
    if (g.lives <= 0) die();
  }

  function loseTarget(t) {
    g.targets.splice(g.targets.indexOf(t), 1);
    g.combo = 0;
    sparks(t.x, t.y, "#6B7088", 10);

    // Ошибки мишеней всегда считаются, кроме активного щита.
    if (g.powers.shield > 0) return;
    if (g.inv > 0) return;
    g.lives--; g.inv = 0.65;
    beep(150, 0.2, "sawtooth", 0.05, -50);
    if (g.lives <= 0) die();
  }

  function checkDefenseWave() {
    if (g.mode !== "defense") return;
    var waveSize = Math.ceil(g.need / 3);
    var next = Math.min(3, Math.floor(g.levelHits / waveSize) + 1);
    if (next > g.defenseWave) {
      g.defenseWave = next;
      g.spawnT = Math.max(g.spawnT, .95);
      g.bannerTitle = "ВОЛНА " + next + " / 3";
      g.bannerSub = next === 2 ? "Новая угроза: дроны-стрелки" : "Бронезащита и массовая атака";
      g.banner = 1.8;
      beep(440,.18,"sawtooth",.035,-120);
    }
  }

  function spawnTarget() {
    var m = g.mode, rank = cycle(g.level), choice = Math.random(), kind;
    if (m === "defense") {
      var wave = g.defenseWave;
      if (wave === 1) kind = g.defenseSpawned === 0 ? "gunner" : choice < .51 ? "rusher" : "gunner";
      else if (wave === 2) kind = choice < .34 ? "rusher" : choice < .77 ? "gunner" : "guardian";
      else kind = choice < .30 ? "rusher" : choice < .65 ? "gunner" : "guardian";
    } else if (m === "run") kind = choice < .70 ? "scout" : choice < .93 ? "weaver" : "armor";
    else kind = choice < .30 ? "scout" : choice < .75 ? "weaver" : "armor";
    var r = kind === "gold" ? 27 : kind === "guardian" ? 32 : kind === "armor" ? 31 : kind === "weaver" ? 24 : kind === "rusher" ? 25 : 27;
    var life = m === "range" ? Math.max(3.5, 4.8-rank*.18) :
               m === "defense" ? 24 : Math.max(2.3, 3.6-rank*.1);
    if (kind === "armor") life += 1.2;
    if (kind === "gold") life = 3.1;
    var x=0,y=0,ok=false;
    for (var tries=0;tries<14&&!ok;tries++) {
      x = m === "defense" ? rand(800,880) : rand(510,870);
      y = m === "defense" ? rand(175,320) : rand(132, GROUND-112);
      ok=true;
      for(var i=0;i<g.targets.length;i++) {
        if (Math.hypot(g.targets[i].x-x,g.targets[i].by-y)<106) { ok=false; break; }
      }
    }
    var hp = kind === "guardian" ? 3+Math.min(rank,2) : kind === "armor" ? 2 : kind === "gunner" ? 2 : 1;
    g.targets.push({ x:x, by:y, y:y, r:r, age:0, life:life, kind:kind, hp:hp,maxHp:hp,
      flash:0, shieldCharge:kind==="guardian"?3:0, fireT:kind==="gunner"?rand(.90,1.12):kind==="guardian"?rand(1.08,1.32):0,
      warning:kind==="gunner"?1.12:kind==="guardian"?1.32:0, rushCharge:kind==="rusher"?.58:0,
      attackCd:0, seed:Math.random()*99,
      amp:kind==="gold"?rand(23,31):kind==="weaver"?rand(40,58):kind==="armor"?rand(7,14):rand(12,22),
      fq:kind==="weaver"?rand(3.1,4.5):rand(1.4,2.6),ph:rand(0,6) });
    if (m === "defense") g.defenseSpawned++;
  }

  function enemyBolt(t) {
    // Враг обозначает атаку при появлении; сам снаряд даёт время на уклонение.
    var dx=playerX()+10-t.x, dy=g.py-56-t.y, mag=Math.max(1,Math.hypot(dx,dy));
    var heavy=t.kind==="guardian";
    var speed=heavy?285+cycle(g.level)*16:340+cycle(g.level)*16;
    g.projectiles.push({kind:"enemy",x:t.x-22,y:t.y,vx:dx/mag*speed,vy:dy/mag*speed,
                        r:heavy?17:12,life:4.6,trail:0,heavy:heavy});
    t.fireT=heavy?rand(2.4,2.95):rand(1.75,2.25);
    t.warning=0;
    sparks(t.x-18,t.y,heavy?"#CBA5FF":"#FF9D6B",heavy?11:7);
    beep(heavy?250:310,.09,"sawtooth",.025,-130);
  }

  // Каждая беговая миссия получает собственный набор препятствий.
  // Первый препятствующий объект появляется не ближе 2 секунд езды,
  // а между следующими есть безопасное расстояние для прыжка.
  var OBSTACLE_SETS = {
    1: [{k:"crate",w:3},{k:"wall",w:2},{k:"spikes",w:2},{k:"gap",w:1}],
    3: [{k:"steam",w:3},{k:"press",w:2},{k:"spikes",w:2},{k:"laser",w:2},{k:"crate",w:1},{k:"gap",w:1}],
    6: [{k:"fan",w:3},{k:"barrier",w:2},{k:"gap",w:3},{k:"pulse",w:2},{k:"crate",w:1}],
    8: [{k:"firewall",w:3},{k:"glitch",w:2},{k:"pulse",w:3},{k:"gap",w:2},{k:"laser",w:1}]
  };
  var OBSTACLE_DIMS = {
    crate:[48,46], wall:[39,77], spikes:[90,22], gap:[94,0], laser:[43,79],
    steam:[72,66], press:[60,74], fan:[66,53], barrier:[44,88],
    pulse:[92,28], firewall:[46,87], glitch:[63,50]
  };
  function obstacleSet() {
    return OBSTACLE_SETS[g.level] || OBSTACLE_SETS[g.mode==="parkour"?3:1];
  }

  function spawnObstacle() {
    var options=obstacleSet(), pool=[];
    options.forEach(function(o){for(var j=0;j<o.w;j++)pool.push(o.k);});
    var kind=pool[Math.floor(Math.random()*pool.length)];
    // Не повторяем одну и ту же преграду два раза подряд.
    if(kind===g.lastObstacleKind && options.length>1) {
      var remaining=pool.filter(function(k){return k!==kind;});
      kind=remaining[Math.floor(Math.random()*remaining.length)];
    }
    g.lastObstacleKind=kind;
    var dims=OBSTACLE_DIMS[kind];
    var w=dims[0]+rand(-4,7),h=dims[1];
    g.obstacles.push({x:W+38,w:w,h:h,kind:kind,scored:false,hit:false,
                      phase:rand(0,Math.PI*2),active:true});
    var jumpSpace = (g.mode === "parkour"?1.12:1.04)*g.speed;
    g.obsLeft = jumpSpace + rand(205,315) + w + (kind==="gap"?42:0);
  }

  function obstacleDanger(o) {
    var t=g.time, p=o.phase;
    switch(o.kind) {
      case "laser": return g.lasersOff<=0 && Math.sin(t*3.1+p)>-.30;
      case "steam": return Math.sin(t*2.65+p)>-.10;
      case "press": return Math.sin(t*2.4+p)>.10;
      case "pulse": return Math.sin(t*3.15+p)>.04;
      case "firewall": return g.lasersOff<=0 && Math.sin(t*3.65+p)>-.15;
      case "glitch": return Math.sin(t*3+p)>-.05;
      default: return true;
    }
  }

  function obstacleCollision(o) {
    var margin=o.kind==="gap"?10:6;
    if(playerX()+11<o.x+margin || playerX()-11>o.x+o.w-margin) return false;
    if(o.kind==="gap") return g.py>=GROUND-10 && g.vy>=0;
    if(!obstacleDanger(o))return false;
    // На телефоне допускаем несколько пикселей погрешности тайминга.
    return g.py-6 > GROUND-o.h+3;
  }

  // Босс не является обычной большой мишенью. Два-три узла питают щит.
  // После их разрушения ядро доступно на короткое время. Фаза меняется по HP.
  function bossNodePosition(b, i) {
    var total = b.nodes.length;
    var angle = b.t * (b.phase >= 3 ? 1.65 : 1.05) + i * 2 * Math.PI / Math.max(1,total) - Math.PI / 2;
    var orbit = b.r + (g.mode === "boss" ? 46 : 36);
    return { x:b.x + Math.cos(angle)*orbit, y:b.y + Math.sin(angle)*orbit*.73 };
  }
  function resetBossShield(b) {
    var count = g.mode === "boss" ? (b.phase === 1 ? 2 : 3) : g.mode === "defense" ? 2 : 1;
    b.nodes = Array.from({length:count},function(_,i){return {hp:g.mode === "boss" && b.phase >= 3 ? 2 : 1, flash:0};});
    b.openT = 0;
    b.attackWarn = 0;
    b.attackGap = 1.15;

  }
  function spawnBoss() {
    var full = g.mode === "boss", commander = g.mode==="defense";
    var hp = (full ? 24 : commander ? 14 : 8) + cycle(g.level)*(full?7:2);
    g.boss = {x:746,y:226,r:full?76:60,hp:hp,max:hp,flash:0,t:0,
      variant:full?"archon":commander?"commander":"sentinel", phase:1, nodes:[],openT:0,attackWarn:0,attackGap:1.4,
      attackPattern:0,attackAimY:GROUND-53,attackCount:0,phaseGlow:0,hitCd:0};
    resetBossShield(g.boss);
    g.banner = 2.3;
    g.bannerTitle = full ? "АРХОНТ · РЕАКТОР" : commander ? "КОМЕНДАНТ БАЗЫ" : "СТРАЖ ГОРОДА";
    g.bannerSub = "Сначала разбей модули щита";
    beep(210,.26,"sawtooth",.05,180);
  }
  function bossBeginAttack(b) {
    // Каждый босс использует собственную схему атак.
    b.attackPattern = b.variant==="sentinel" ? [0,2,0,1][b.attackCount%4] :
                      b.variant==="commander" ? [1,3,0,3,2][b.attackCount%5] :
                      [0,1,2,3,1][b.attackCount%5];
    // Контрастная подсказка минимум 0,85 с до реальных снарядов.
    b.attackWarn = b.phase >= 3 ? .85 : 1.05;
    b.attackAimY = Math.max(130, Math.min(GROUND-35,g.py-58));
    b.attackCount++;
    beep(370,.14,"triangle",.032,-80);
  }
  function bossReleaseAttack(b) {
    var cx=b.x-b.r-10,rank=cycle(g.level), phase=b.phase;
    var sp=260+phase*23+rank*12;
    if(b.attackPattern === 0) {
      var dx=PX-cx,dy=b.attackAimY-b.y,len=Math.max(1,Math.hypot(dx,dy));
      g.projectiles.push({kind:"boss",style:"plasma",x:cx,y:b.y,vx:dx/len*sp,vy:dy/len*sp,r:17,life:5});
      if(phase>=2) g.projectiles.push({kind:"boss",style:"skimmer",x:cx,y:GROUND-37,vx:-sp*.96,vy:0,r:14,life:5});
    } else if(b.attackPattern === 1) {
      var ys=phase>=3?[125,228,335,402]:[158,275,388];
      ys.forEach(function(y,i){g.projectiles.push({kind:"boss",style:"bolt",x:cx+i*28,y:y,vx:-sp*(.84+i*.04),vy:0,r:13,life:5});});
    } else if(b.attackPattern===3) {
      if(g.targets.length<3){
        var drone={x:880,y:220+rand(-55,55),by:220,age:0,life:13,kind:"rusher",hp:1,maxHp:1,
          r:25,flash:0,shieldCharge:0,fireT:0,warning:0,attackCd:0,seed:4,amp:12,fq:2,ph:rand(0,6)};
        g.targets.push(drone);
      }
      if(b.variant==="archon") g.projectiles.push({kind:"boss",style:"skimmer",x:cx,y:GROUND-24,vx:-sp*.95,vy:0,r:17,life:5});
    } else if(b.attackPattern===4) {
      var count = phase>=3?3:2;
      for(var mi=0; mi<count; mi++){
        g.projectiles.push({kind:"bossMine",style:"mine",x:cx+mi*28,y:160+mi*88,vx:-110-mi*12,vy:0,r:16,life:4.6,arm:.55+mi*.12,pulse:0});
      }
    } else if(b.attackPattern===5) {
      var lanes = phase>=3?4:3;
      for(var si=0; si<lanes; si++){
        var sx = 890 + si*48;
        var sy = 98 + si*58;
        g.projectiles.push({kind:"bossShard",style:"shard",x:sx,y:sy,vx:-220-si*8,vy:130+si*28,r:12,life:4.2,spin:rand(-8,8)});
      }
    } else {
      g.projectiles.push({kind:"boss",style:"wave",x:cx,y:GROUND-18,vx:-sp*1.05,vy:0,r:19,life:5});
      if(phase>=2) g.projectiles.push({kind:"boss",style:"wave",x:cx+125,y:GROUND-18,vx:-sp*1.05,vy:0,r:19,life:5});
    }
    explosionBurst(cx,b.y,"#FF8B92");
    beep(175,.20,"sawtooth",.048,-85);
  }
  function updateBoss(b,wd,dt) {
    b.t += wd;
    var factor=g.mode === "boss"?1:0.8;
    b.x=748+Math.sin(b.t*.73*factor)*42;
    b.y=228+Math.sin(b.t*1.1*factor)*45;
    b.flash=Math.max(0,b.flash-dt);
    b.hitCd=Math.max(0,b.hitCd-wd);
    b.phaseGlow=Math.max(0,b.phaseGlow-dt);
    b.nodes.forEach(function(n){n.flash=Math.max(0,n.flash-dt);});
    if(b.nodes.length===0 && b.openT>0) {
      b.openT-=wd;
      if(b.openT<=0) resetBossShield(b);
    }
    b.attackGap-=wd;
    if(b.attackWarn>0){
      b.attackWarn-=wd;
      if(b.attackWarn<=0){bossReleaseAttack(b);b.attackGap=Math.max(1.35,2.7-b.phase*.27);}
    } else if(b.attackGap<=0) bossBeginAttack(b);
  }

    /* ---------- Обновление ---------- */
  function update(dt) {
    g.time += dt;
    if (g.banner > 0) g.banner = Math.max(0, g.banner - dt);
    if (g.inv > 0) g.inv = Math.max(0, g.inv - dt);
    if (g.shake > 0) g.shake = Math.max(0, g.shake - dt);
    g.recoil = Math.max(0, g.recoil-dt*1.4);
    g.weatherClock += dt;
    g.lasersOff=Math.max(0,g.lasersOff-dt);
    g.hitFlash = Math.max(0,g.hitFlash-dt);
    g.muzzle = Math.max(0,(g.muzzle||0)-dt);
    g.jumpFlash = Math.max(0,g.jumpFlash-dt*2);
    g.landPulse = Math.max(0,g.landPulse-dt*2.3);
    updateDash(dt);
    g.dashCd = Math.max(0,g.dashCd-dt);
    var dashBtn = $("#dash");
    if (dashBtn.disabled !== (g.dashCd > 0)) dashBtn.disabled = g.dashCd > 0;
    var dashLabel = g.dashT > 0 ? "РЫВОК!" : g.dashCd > 0 ? "Рывок " + Math.ceil(g.dashCd) + "с" : "Рывок";
    dashBtn.classList.toggle("is-dashing", g.dashT > 0);
    if (dashBtn.textContent !== dashLabel) dashBtn.textContent = dashLabel;
    if (g.clearT > 0) {
      updateActor(dt);
      g.clearT -= dt;
      if (g.clearT <= 0) {
        if(g.level===CAMPAIGN.length){
          state="menu";stage.classList.remove("playing");
          if(g.score>best){best=g.score;newRecord=true;try{localStorage.setItem("prime_run_best",String(best));}catch(e){}}
          showPanel("victory");
        } else startLevel(g.level + 1);
      }
      updateEffects(dt);
      return;
    }

    Object.keys(g.powers).forEach(function(k) {
      g.powers[k] = Math.max(0, g.powers[k] - dt);
    });
    var wd = dt * (g.powers.slow > 0 ? 0.46 : 1);
    g.dist += g.speed * wd + g.dashStep;
    if (g.mode === "parkour") {
      g.levelDist += g.speed * wd + g.dashStep;
      if (g.levelDist >= g.goalDist) { finishLevel(); updateEffects(dt); return; }
    }
    if (g.mode === "range") {
      g.timer -= wd;
      if (g.timer <= 0) {
        g.timer = 12;
        hurt(PX, g.py - 45);
        floatText(740, 100, "ВРЕМЯ ВЫШЛО", WARN);
        if (state !== "play") return;
      }
    }

    if (g.jumpBuf > 0) {
      g.jumpBuf -= dt;
      if (g.onGround || (g.mode === "parkour" && g.jumpCount < 2)) {
        g.vy = -JUMP_V * (g.jumpCount ? 0.87 : 1);
        g.onGround = false; g.jumpCount++; g.jumpBuf = 0; g.jumpFlash = 0.65;
        g.landPulse = 0;
        if(g.actor) {g.actor.takeoff=1;g.actor.landing=0;}
        sparks(PX, g.py - 10, GLOW, 6);
        beep(380 + 100 * g.jumpCount, 0.14, "square", 0.04, 300);
      }
    }
    if (!g.onGround) {
      // Замедляем прыжок вместе с миром: траектория относительно препятствий
      // остаётся такой же, а время на реакцию возрастает.
      g.vy += GRAV * wd;
      g.py += g.vy * wd;
      if (g.py >= GROUND) {
        g.py = GROUND; g.vy = 0; g.onGround = true; g.jumpCount = 0;
        g.landPulse = 0.88;
        if(g.actor) {g.actor.landing=1;g.actor.takeoff=0;}
        sparks(PX, GROUND-5, "#71809C", 8);
        beep(160, 0.08, "triangle", 0.013, -50);
      }
    } else {
      g.anim += wd * g.speed / 40;
      g.footT += dt;
      if (g.footT > .14 && (g.mode === "parkour" || g.mode === "run")) {
        g.footT = 0;
        if (!reduceMotion) {
          g.parts.push({ x:PX-12, y:GROUND-3, vx:rand(-90,-30), vy:rand(-60,-10),life:.22,max:.22,color:"#64718D" });
        }
      }
    }

    updateActor(dt);

    // Золотые разведчики — отдельная мини-задача в тире, не влияют на необходимое число попаданий.
    if(g.mode==="range" && g.levelHits<g.need) {
      g.rangeGoldT-=wd;
      if(g.rangeGoldT<=0){
        if(!g.targets.some(function(t){return t.kind==="gold";})) {
          spawnTarget();
          var gold=g.targets[g.targets.length-1];
          gold.kind="gold";gold.hp=1;gold.maxHp=1;gold.r=27;gold.life=3.1;gold.amp=27;
          gold.x=850;gold.by=192+Math.sin(g.time)*57;
        }
        g.rangeGoldT=rand(6.8,8.9);
      }
    }
    var targetMode = g.mode === "run" || g.mode === "range" || g.mode === "defense";
    if (targetMode && !g.boss) {
      g.spawnT -= wd;
      var maxVisible = g.mode === "defense" ? 4 : 3;
      if (g.spawnT <= 0 && g.targets.length < maxVisible && g.levelHits + g.targets.length < g.need) {
        spawnTarget();
        g.spawnT = g.mode === "range" ? .76 : g.mode === "defense" ? Math.max(.78,1.15-g.defenseWave*.09) : 1.02;
      }
      if(g.mode==="range" && g.levelHits>=g.need) g.targets=g.targets.filter(function(t){return t.kind!=="gold";});
      if (g.levelHits >= g.need && g.targets.length === 0) {
        if (g.mode === "run" || g.mode === "defense") spawnBoss();
        else { finishLevel(); updateEffects(dt); return; }
      }
    }
    for (var i = g.targets.length - 1; i >= 0; i--) {
      var t=g.targets[i];
      t.age+=wd;
      if(t.flash>0)t.flash=Math.max(0,t.flash-dt);
      if(g.mode==="defense") {
        if(t.kind==="rusher") {
          // Первые 0.58 с — подсветка зарядки, затем резкий таран.
          t.rushCharge=Math.max(0,(t.rushCharge||0)-wd);
          var rushSpeed=t.rushCharge>0 ? 82 : 255+g.defenseWave*26+cycle(g.level)*18;
          t.x-=rushSpeed*wd;
          var targetY=g.py-54;
          t.y+=(targetY-t.y)*Math.min(1,wd*(t.x>PX+145?1.1:.40));
          t.y+=Math.sin(t.age*9+t.ph)*.9;
        } else if(t.kind==="gunner" || t.kind==="guardian") {
          var guardian=t.kind==="guardian";
          t.x-=(t.age>(guardian?7.2:6.5)?(guardian?180:210):(guardian?80:48))*wd;
          t.y=t.by+Math.sin(t.age*(guardian?1.65:2.3)+t.ph)*(guardian?15:27);
          // Первый залп готовится уже при появлении; прицел виден заранее.
          t.fireT-=wd;
          t.warning=t.fireT<=.88 && t.fireT>0 ? t.fireT : 0;
          if(t.fireT<=0)enemyBolt(t);
        }
        // На исходящем участке рывка слабые дроны уничтожаются тараном.
        if (dashStrike(t)) continue;
        // Соприкосновение с реальным положением героя во время рывка.
        var contactX = playerX();
        if(t.x<contactX+24 && Math.hypot(t.x-contactX,(t.y-(g.py-51))*.8)<t.r+29) {
          g.targets.splice(i,1); sparks(contactX,g.py-55,WARN,15);
          hurt(contactX,t.y);
          if(state!=="play")return;
          continue;
        }
        // Промахнувшийся таран можно перепрыгнуть — это считается уклонением.
        if(t.x<PX-57) {
          g.targets.splice(i,1);
          if(t.kind==="rusher") {
            g.defenseDodges++;g.levelHits++;g.score+=70;
            checkDefenseWave();
            floatText(PX+40,g.py-100,"УКЛОНЕНИЕ +70",POWER_DATA.slow.color);
          } else {
            hurt(PX,g.py-45);
            if(state!=="play")return;
          }
          continue;
        }
      } else {
        t.x-=(g.mode==="range"?20:g.speed*.2)*wd*(t.kind==="armor"?.73:t.kind==="weaver"?1.25:1);
        t.y=t.by+Math.sin(t.age*t.fq+t.ph)*t.amp;
        if (g.mode === "run" && dashStrike(t)) continue;
      }
      if(t.age>=t.life || (g.mode!=="defense"&&t.x<190)) {
        if(t.kind==="gold") {g.targets.splice(i,1);continue;}
        loseTarget(t);
        if(state!=="play")return;
      }
    }

  
    if(g.boss) updateBoss(g.boss,wd,dt);
    for (var i=g.projectiles.length-1;i>=0;i--) {
      var pr=g.projectiles[i];
      pr.x+=pr.vx*wd; pr.y+=(pr.vy||0)*wd;
      if(pr.style==="shard") pr.vy += 34*wd;
      if(pr.style==="mine") {
        pr.pulse = (pr.pulse||0) + wd*7;
        pr.arm = Math.max(0,(pr.arm||0)-wd);
        if(pr.arm<=0 && Math.abs(pr.x-playerX())<pr.r+28 && Math.abs(pr.y-(g.py-44))<56) pr.life = 0.01;
      }
      pr.life=(pr.life==null?4:pr.life)-wd;
      if(pr.life<=0){
        if(pr.style==="mine"){
          explosionBurst(pr.x,pr.y,"#FF92A8");
          if(Math.abs(pr.x-playerX())<pr.r+48 && pr.y+pr.r>g.py-104 && pr.y-pr.r<g.py+10) { hurt(playerX(),pr.y); if(state!=="play")return; }
        }
        g.projectiles.splice(i,1);continue;
      }
      if(pr.x<65||pr.y<50||pr.y>H+34){g.projectiles.splice(i,1);continue;}
      var playerHit= pr.kind==="enemy" ?
        (Math.abs(pr.x-playerX())<pr.r+19 && pr.y>g.py-92-pr.r && pr.y<g.py+pr.r) :
        (Math.abs(pr.x-playerX())<21+pr.r && pr.y+pr.r>g.py-90 && pr.y-pr.r<g.py);
      if(playerHit) {
        if(pr.style==="mine") explosionBurst(pr.x,pr.y,"#FF92A8");
        else sparks(pr.x,pr.y,pr.kind==="enemy"?"#FFB37D":WARN,10,1.0,"spark");
        g.projectiles.splice(i,1);hurt(playerX(),pr.y);
        if(state!=="play")return;
      }
    }

      if (g.mode === "parkour" || g.mode === "run") {
      g.obsLeft -= g.speed * wd + g.dashStep;
      if (g.obsLeft <= 0) spawnObstacle();
    }
    for (var j = g.obstacles.length - 1; j >= 0; j--) {
      var o = g.obstacles[j];
      o.x -= g.speed * wd + g.dashStep;
      if (!o.scored && o.x + o.w < PX - 26) {
        o.scored = true; g.obstaclePassed++;
        if (g.mode === "parkour" && !o.hit) {
          g.combo++; g.maxCombo = Math.max(g.combo, g.maxCombo);
          var gain = 90 + Math.min(g.combo, 10) * 10;

  function drawGround() {
    var n=g.level;
    var tones=['#0A111E','#08252B','#251B19','#17283A','#260F19',
               '#183449','#173747','#112923','#1D213E','#1D102D'];
    var line=['#7D95D0','#70D9D3','#F3A05E','#779CE3','#D9687C',
              '#9AC8E5','#B5EDF4','#69D8AA','#9F93E4','#B07DDB'];
    var base=tones[n-1]||tones[0], edge=line[n-1]||line[0];
    var gg=ctx.createLinearGradient(0,GROUND,0,H);
    gg.addColorStop(0,base);gg.addColorStop(1,'#05070D');
    ctx.fillStyle=gg;ctx.fillRect(0,GROUND,W,H-GROUND);
    ctx.save();ctx.strokeStyle=edge;ctx.globalAlpha=.19;ctx.lineWidth=1.2;
    var off=g.dist%76;
    if(n===3||n===5||n===8){
      // Заводская решётка / реакторный настил / серверные дорожки.
      for(var i=0;i<13;i++){
        var x=i*92-off;
        ctx.strokeRect(x,GROUND+19,83,55);
        ctx.beginPath();ctx.moveTo(x,GROUND+48);ctx.lineTo(x+83,GROUND+48);ctx.stroke();
      }
    }else if(n===7){
      // Ледяная гладь с широкими трещинами.
      for(var i=0;i<8;i++){
        var x=i*150-off;
        sceneryLine([[x,GROUND+38],[x+42,GROUND+67],[x+70,GROUND+55],[x+100,H]],'#C9F8FF',1.3,.18);
      }
    }else if(n===9){
      // Тяжёлый пирс со швами.
      for(var i=0;i<12;i++){
        var x=i*96-off;ctx.beginPath();ctx.moveTo(x,GROUND);ctx.lineTo(x+19,H);ctx.stroke();
      }
      sceneryLine([[0,GROUND+53],[960,GROUND+53]],edge,2,.12);
    }else if(n===10){
      // Левитирующий настил: сегментированные линии.
      for(var i=0;i<15;i++){
        var x=i*76-off;sceneryPoly([[x,GROUND+10],[x+64,GROUND+10],[x+54,GROUND+30],[x-7,GROUND+30]],'#75479A',.14);
      }
    }else{
      // Широкие перспективные направляющие.
      for(var i=-1;i<16;i++){
        var x=i*76-off;
        ctx.beginPath();ctx.moveTo(x,GROUND);ctx.lineTo(W/2+(x-W/2)*2.3,H);ctx.stroke();
      }
      for(var j=1;j<5;j++){
        var y=GROUND+(H-GROUND)*Math.pow(j/5,1.65);
        ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
      }
    }
    ctx.restore();
    ctx.save();ctx.strokeStyle=edge;ctx.lineWidth=2.6;ctx.globalAlpha=.65;
    ctx.beginPath();ctx.moveTo(0,GROUND+1);ctx.lineTo(W,GROUND+1);ctx.stroke();ctx.restore();
  }

  function bullseye(x, y, r, outer, mid, inner) {

    ctx.beginPath(); ctx.arc(x, y, r * 0.66, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = inner;
    ctx.beginPath(); ctx.arc(x, y, r * 0.34, 0, Math.PI * 2); ctx.fill();
  }

  function drawTargets(){
    for(var i=0;i<g.targets.length;i++){
      var t=g.targets[i],r=t.r,frac=Math.max(0,1-t.age/t.life);
      var col=t.kind==="gold"?"#FFDA86":t.kind==="armor"?"#FFB66D":t.kind==="weaver"?"#FF8EC4":
              t.kind==="rusher"?"#FF738C":t.kind==="gunner"?"#FFC68F":t.kind==="guardian"?"#BCA4FF":"#85EFFF";
      var rise=Math.min(1,t.age/.19),rot=t.age*(t.kind==="weaver"?14:11)+t.ph;
      ctx.save();ctx.translate(t.x,t.y);ctx.scale(rise,rise);
      ctx.globalAlpha=.12;ctx.fillStyle=col;
      for(var tr=2;tr>=1;tr--){ctx.beginPath();ctx.ellipse(-r-tr*9,Math.sin(rot*.25)*2,r*.8,3+tr,0,0,Math.PI*2);ctx.fill();}
      ctx.globalAlpha=1;
      // Time-to-hit ring is an arc, not text.
      ctx.strokeStyle=(g.mode!=="defense"&&frac<.25)?"#FF747A":col;
      ctx.lineWidth=2.4;ctx.lineCap="round";ctx.beginPath();ctx.arc(0,0,r+13,-Math.PI/2,-Math.PI/2+Math.PI*2*frac);ctx.stroke();
      // Curved side rotors with rotating turbine disks.
      for(var wing=-1;wing<=1;wing+=2){
        var rx=wing*(r+10);
        ctx.save();ctx.translate(rx,-3);ctx.rotate(rot*wing);
        ctx.fillStyle="#25323E";ctx.beginPath();ctx.ellipse(0,0,12,11,0,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle=col;ctx.lineWidth=2.2;ctx.beginPath();ctx.ellipse(0,0,11,10,0,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle=col;ctx.globalAlpha=.7;
        for(var blade=0;blade<3;blade++){ctx.rotate(Math.PI*2/3);ctx.beginPath();ctx.moveTo(-2,0);ctx.quadraticCurveTo(11,-10,9,-1);ctx.quadraticCurveTo(3,2,-2,0);ctx.fill();}
        ctx.restore();
      }
      ctx.save();ctx.shadowColor=col;ctx.shadowBlur=t.flash>0?19:9;
      var rad=ctx.createRadialGradient(-r*.3,-r*.36,4,0,0,r*1.13);

      }else if(t.kind==="weaver"){
        softPolygonPath([[-r*1.1,0],[-r*.68,-r*.8],[0,-r*.6],[r*.67,-r*.83],[r*1.14,0],[r*.62,r*.78],[0,r*.5],[-r*.6,r*.75]],11);
      }else if(t.kind==="gunner"){
        softPolygonPath([[-r*.9,-r*.6],[-r*.45,-r*.86],[r*.6,-r*.76],[r*.99,-r*.28],[r*.90,r*.59],[r*.4,r*.83],[-r*.65,r*.76],[-r*.96,r*.20]],9);
      }else{
        ctx.beginPath();ctx.ellipse(0,0,r*.94,r*.79,0,0,Math.PI*2);
      }
      ctx.fillStyle=rad;ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=t.kind==="armor"||t.kind==="guardian"?4:2.4;ctx.stroke();
      ctx.restore();
      // Shell highlights and curved scanner optic.
      ctx.strokeStyle="rgba(233,248,255,.28)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(-1,-4,r*.6,Math.PI*1.18,Math.PI*1.86);ctx.stroke();
      ctx.save();ctx.shadowColor=col;ctx.shadowBlur=9;

      ctx.fillStyle="#FFFFFF";ctx.beginPath();ctx.ellipse(5,-2,3.4,2.1,0,0,Math.PI*2);ctx.fill();ctx.restore();
      if(t.kind==="gunner" || t.kind==="guardian"){

        }

      ctx.restore();

  }

  function drawBoss(){

      var gr=ctx.createLinearGradient(b.r*.55,-20,b.r+43,18);

      softPolygonPath([[b.r*.54,-13],[b.r+12,-23],[b.r+42,-14],[b.r+39,9],[b.r+7,19],[b.r*.57,13]],12);
      ctx.fillStyle=gr;ctx.fill();ctx.strokeStyle=shield?"#648ABD":tint;ctx.lineWidth=2.4;ctx.stroke();
      ctx.strokeStyle="rgba(219,237,255,.23)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(b.r*.62,-10);ctx.quadraticCurveTo(b.r+24,-19,b.r+36,-10);ctx.stroke();
      ctx.restore();

        ctx.globalAlpha=.28*pulse; ctx.fillStyle=armed?"#FF8AA0":"#F0DBFF"; ctx.beginPath();ctx.arc(p.x,p.y,p.r+7*pulse,0,Math.PI*2);ctx.fill();
      } else if(p.style==="shard"){
        ctx.translate(p.x,p.y); ctx.rotate((p.spin||0)*(g.time*.9)+Math.atan2(p.vy,p.vx));
        ctx.shadowColor="#FFB9D3"; ctx.shadowBlur=14; ctx.fillStyle="#FFDDEA"; ctx.strokeStyle="#FF8CAC"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(-4,-8); ctx.lineTo(-11,0); ctx.lineTo(-4,8); ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if(p.style==="wave"){
        ctx.shadowColor="#FF8579"; ctx.shadowBlur=14; ctx.strokeStyle="#FFC2A7"; ctx.lineWidth=4;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,Math.PI,Math.PI*2); ctx.stroke();
        ctx.strokeStyle="#FF7E75"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(p.x-p.r,p.y); ctx.lineTo(p.x+p.r,p.y); ctx.stroke();
      } else {
        ctx.shadowColor=p.heavy?"#CDA2FF":enemy?"#FF9D6A":WARN;ctx.shadowBlur=14;
        ctx.fillStyle=p.heavy?"#DDC4FF":enemy?"#FFB37D":WARN;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle=enemy?"#FF876E":"#FFFFFF";ctx.lineWidth=3;ctx.globalAlpha=.55;
        ctx.beginPath();ctx.moveTo(p.x-p.vx*.08,p.y-(p.vy||0)*.08); ctx.lineTo(p.x-p.vx*.22,p.y-(p.vy||0)*.22);ctx.stroke();
        ctx.globalAlpha=1;ctx.fillStyle="#FFF9EE"; ctx.beginPath();ctx.arc(p.x,p.y,p.r*.35,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    }
  }

    function drawEffects() {
    var i;
    for (i = 0; i < g.beams.length; i++) {
      var b = g.beams[i];
      var a = b.life / 0.12;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.strokeStyle = GLOW;
      ctx.lineWidth = 3;
      ctx.shadowColor = GLOW;
      ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
      ctx.fillStyle = "#FFFFFF";
      ctx.beginPath(); ctx.arc(b.x2, b.y2, 5 * a + 1, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    for (i = 0; i < g.parts.length; i++) {
      var p = g.parts[i], a = Math.max(0, p.life / p.max);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(p.x, p.y); ctx.rotate((p.rot||0) + (p.vr||0)*(1-a)*0.08);
      ctx.fillStyle = p.color;
      var sz = p.size || 4;
      if(p.shape === "circle") { ctx.beginPath(); ctx.arc(0,0,sz*0.5,0,Math.PI*2); ctx.fill(); }
      else if(p.kind === "smoke") { ctx.globalAlpha = a*0.35; ctx.beginPath(); ctx.arc(0,0,sz,0,Math.PI*2); ctx.fill(); }
      else { rr(-sz*.5,-sz*.5,sz,sz,Math.max(1,sz*.4)); ctx.fill(); }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    for (i = 0; i < g.texts.length; i++) {
      var t = g.texts[i];
      txtD(t.s, t.x, t.y, 26, t.color, "center", Math.min(1, t.life / 0.4));
    }
  }

  function drawHUD() {
    var m = modeOf(g.level);
    txt("МИССИЯ " + g.level + " · " + CAMPAIGN[g.level-1].name, 26, 35, 14, MUTED);
    var pw = 220, prog = 0, status = "";
    if (g.mode === "parkour") {
      prog = g.levelDist/g.goalDist;
      status = "Дистанция " + Math.min(Math.round(g.levelDist),g.goalDist) + " / " + g.goalDist + " м";
    } else if (g.boss) {
      prog = 1 - g.boss.hp / g.boss.max;
      status = (g.boss.variant==="commander"?"КОМЕНДАНТ":g.boss.variant==="sentinel"?"СТРАЖ":"АРХОНТ") + " · ФАЗА " + g.boss.phase + " · " + (g.boss.nodes.length ? "модули " + g.boss.nodes.length : "ядро открыто " + Math.ceil(g.boss.openT) + "с") + " · " + g.boss.hp + " HP";
    } else {
      prog = g.need ? g.levelHits/g.need : 0;
      status = (g.mode === "defense" ? "ВОЛНА "+g.defenseWave+"/3 · УГРОЗЫ " : "Дроны ") + g.levelHits + " / " + g.need;
      if (g.mode === "range") status += " · " + Math.ceil(g.timer) + " сек · ЗОЛОТО +4с";
    }
    ctx.fillStyle="rgba(255,255,255,0.14)";rr(26,46,pw,8,4);ctx.fill();
    if (prog > 0) {ctx.fillStyle=GLOW;rr(26,46,Math.min(1,Math.max(0,prog))*pw,8,4);ctx.fill();}
    txt(status,26,74,13,MUTED);
    if((g.mode==="run"||g.mode==="parkour") && !g.boss){
      var hint=g.level===3?"ПАР · ПРЕСС · ЛАЗЕР":g.level===6?"ТУРБИНЫ · ПРОВАЛЫ":g.level===8?"ФАЙРВОЛ · ИМПУЛЬС":"БАРРИКАДЫ · ЯЩИКИ";
      txt(hint,26,92,11,"#90A0BC");
    }
    txtD(fmt(g.score), W/2, 56, 56, WHITE,"center");
    if (g.combo>=2) txt("КОМБО ×"+g.combo,W/2,79,14,GLOW,"center");
    for (var i=0;i<g.maxLives;i++) {
      var x=W-26-(g.maxLives-i)*20;
      if (i<g.lives) {ctx.fillStyle=POWER_DATA.life.color;rr(x,27,14,10,4);ctx.fill();}
      else {ctx.strokeStyle="rgba(255,255,255,0.25)";ctx.lineWidth=1.4;rr(x,27,14,10,4);ctx.stroke();}
    }
    txt("ЖИЗНИ " + g.lives + "/" + g.maxLives, W-26,64,13,MUTED,"right");
    txt("✦ "+fmt(progress.credits)+" КРЕДИТОВ",W-26,84,12,"#FFD48D","right");
    var buffY=108;
    ["double","slow","shield"].forEach(function(key) {
      if (g.powers[key] > 0) {
        var pd=POWER_DATA[key];
        ctx.fillStyle="rgba(9,11,19,.78)";rr(26,buffY,165,27,8);ctx.fill();
        ctx.strokeStyle=pd.color;ctx.lineWidth=1;rr(26,buffY,165,27,8);ctx.stroke();
        txt(pd.sign+" " + pd.name,34,buffY+18,11,pd.color);
        txt(Math.ceil(g.powers[key])+"с",184,buffY+18,11,WHITE,"right");
        buffY += 31;
      }
    });
    if (g.mode === "defense") {
      var incoming=g.targets.filter(function(t){return t.kind==="rusher"&&t.x<380;}).length;
      if(incoming>0) txt("⚠ ТАРАН БЛИЗКО!",W/2,112,17,"#FF9FAA","center");
      if(g.defenseDodges>0) txt("УКЛОНЕНИЯ " + g.defenseDodges,W-26,113,12,"#97D9FF","right");
    }
    if (g.mode === "parkour" && g.jumpCount === 1 && !g.onGround)
      txt("ЕЩЁ ОДИН ПРЫЖОК!",PX,330,13,GLOW,"center");
    if(g.dashCd>0 && g.mode!=="range")
      txt("SHIFT · РЫВОК " + Math.ceil(g.dashCd) + "с",W-26,111,12,POWER_DATA.slow.color,"right");
    else if(g.mode!=="range")
      txt("SHIFT · ЭНЕРГОРЫВОК ГОТОВ",W-26,111,12,"#FFAB64","right");
    if (g.banner > 0) {
      var a = Math.min(1, g.banner/0.5);
      txtD(g.bannerTitle,W/2,176,66,WHITE,"center",a);
      txt(g.bannerSub,W/2,210,20,GLOW,"center",a);
    }
  }

    function draw() {
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (g.shake > 0 && !reduceMotion) {
      ctx.translate((Math.random() - 0.5) * 14 * g.shake * 3, (Math.random() - 0.5) * 14 * g.shake * 3);
    }
    drawBackground();
    drawGround();
    drawObstacles();
    drawInteractives();
    drawTargets();
    drawBoss();
    drawProjectiles();
    drawPickups();
    drawPlayer();
    drawEffects();
    if(state==="play") {
      var ax=g.aim.x, ay=g.aim.y;
      ctx.save();ctx.strokeStyle=g.powers.double>0?POWER_DATA.double.color:GLOW;
      ctx.lineWidth=1.5;ctx.globalAlpha=.52;
      ctx.beginPath();ctx.arc(ax,ay,10,0,Math.PI*2);ctx.stroke();
      for(var ci=0;ci<4;ci++){
        var ca=ci*Math.PI/2;
        ctx.beginPath();ctx.moveTo(ax+Math.cos(ca)*15,ay+Math.sin(ca)*15);
        ctx.lineTo(ax+Math.cos(ca)*22,ay+Math.sin(ca)*22);ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();
    if (g.powers.slow>0 && state==="play") {
      ctx.fillStyle="rgba(70,170,255,0.045)";ctx.fillRect(0,0,W,H);
    }
    if (g.hitFlash>0 && state==="play") {
      ctx.fillStyle="rgba(255,92,112,"+(g.hitFlash*.14).toFixed(3)+")";
      ctx.fillRect(0,0,W,H);
    }
    if (g.shake > 0 && state === "play") {
      ctx.fillStyle = "rgba(255,90,110," + (g.shake * 0.45).toFixed(3) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    if (state === "play" || state === "paused") drawHUD();
  }

  /* ---------- Цикл ---------- */
  var last = 0;
  function frame(ts) {
    var dt = Math.min(0.033, (ts - last) / 1000 || 0);
    last = ts;
    if (state === "play") update(dt);
    else if (state === "menu" || state === "over") {
      g.dist += 90 * dt;
      g.time += dt;
      g.anim += dt * 7;
      updateActor(dt);
      for (var n = g.parts.length - 1; n >= 0; n--) {
        var p = g.parts[n];
        p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.rot = (p.rot||0) + (p.vr||0) * dt;
        if (p.life <= 0) g.parts.splice(n, 1);
      }
    }
    draw();
    requestAnimationFrame(frame);
  }

  resize();
  showPanel("menu");
  requestAnimationFrame(frame);
})();
</script>
<aside id="k4-update" hidden role="status" aria-live="polite">
  <span id="k4-update-text">Вышло обновление игры.</span>
  <button id="k4-apply-update" type="button">Обновить</button>
  <button id="k4-close-update" type="button" aria-label="Закрыть уведомление">Позже</button>
</aside>
<div id="k4-popup" hidden role="dialog" aria-modal="true" aria-label="Установка игры">
  <div id="k4-popup-inner"><strong>K4 PRIME RUN</strong><span id="k4-popup-text"></span><button id="k4-popup-close" type="button">Понятно</button></div>
</div>
<script src="pwa.js" defer></script>
</body>
</html>
